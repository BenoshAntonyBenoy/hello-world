<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="hello-world analyses job postings to show the skills employers actually ask for, so you can prepare for the job rather than the syllabus."
    />
    <title>hello-world — Learn what the industry actually wants</title>

    <!-- Applied before the bundle runs, so a dark-theme visitor does not get a
         white flash on every load. `useTheme` in src/lib/hooks.ts takes over
         once React mounts; the storage key must stay in step with THEME_KEY. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('helloworld.theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* storage unavailable — fall through to the light default */
        }
      })()
    </script>

    <meta name="theme-color" content="#fbfaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0c0b" media="(prefers-color-scheme: dark)" />

    <!-- Link previews. Absolute URLs: most crawlers will not resolve a relative
         og:image, and VITE_BASE_PATH differs between a project page and a
         domain root. Update these if the site moves.
         The card itself is generated art — see frontend/public/og.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="hello-world" />
    <meta property="og:title" content="hello-world — What job do you want?" />
    <meta
      property="og:description"
      content="The skills employers actually ask for, extracted from job postings — with the sample size attached."
    />
    <meta property="og:url" content="https://helloworld.benosh.tech/" />
    <meta property="og:image" content="https://helloworld.benosh.tech/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="hello-world — the skills employers actually ask for, extracted from job postings."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The engineer mark, matching src/components/Logo.tsx. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c2410c'/%3E%3Cg fill='white'%3E%3Cpath d='M6.5 29.5a9.5 7.8 0 0 1 19 0z'/%3E%3Ccircle cx='16' cy='18' r='3.6'/%3E%3Crect x='6.2' y='12.2' width='19.6' height='2.5' rx='1.25'/%3E%3Cpath d='M9.4 12.2a6.6 6.6 0 0 1 13.2 0z'/%3E%3Crect x='15' y='4.6' width='2' height='3.2' rx='1'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
